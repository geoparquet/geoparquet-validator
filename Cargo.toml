[package]
name = "geoparquet-validator"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/geoparquet/geoparquet-validator"
keywords = ["geoparquet", "parquet", "geospatial", "validation", "ogc"]
categories = ["command-line-utilities", "science::geo"]
exclude = ["corpus/*", "fixtures/*", "web/pkg/*", "npm/*", ".github/*"]
description = "Validate GeoParquet files against the OGC abstract tests and the 1.0/1.1 community specifications"

[lib]
name = "geoparquet_validator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "geoparquet-validator"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# the command line, including object-store reading
cli = ["dep:clap", "remote"]
remote = ["dep:object_store", "dep:tokio", "dep:futures", "dep:url"]
# the browser build: `cargo build --lib --target wasm32-unknown-unknown --no-default-features --features wasm`
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# the Python extension module (built by maturin, see pyproject.toml); includes the command line
python = ["dep:pyo3", "cli"]
# the C interface (include/geoparquet_validator.h)
capi = ["remote"]

[dependencies]
anyhow = "1.0.104"
arrow-array = "59.3.0"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"], optional = true }
futures = { version = "0.3.34", optional = true }
jsonschema = { version = "0.53.0", default-features = false }
object_store = { version = "0.14.1", features = ["aws", "gcp", "azure", "http"], optional = true }
parquet = "59.3.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"], optional = true }
url = { version = "2.5.8", optional = true }

wasm-bindgen = { version = "=0.2.128", optional = true }
js-sys = { version = "0.3", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
