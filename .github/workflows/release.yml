name: Release

# Tag a version to publish it:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          NAME=geoparquet-validator-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$NAME"
          cp README.md LICENSE "$NAME"/
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/geoparquet-validator.exe "$NAME"/
            7z a "$NAME.zip" "$NAME"
          else
            cp target/${{ matrix.target }}/release/geoparquet-validator "$NAME"/
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true

  wheels:
    name: python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest,   target: aarch64 }
          - { os: macos-latest,   target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      # maturin packages the command-line binary into a wheel, so `pip install
      # geoparquet-validator` provides the same tool without a Python extension module.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --bindings bin --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.whl

  crate:
    name: crates.io
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: crates.io is configured to trust this repository and workflow, and
      # mints a short-lived token per run, so no CARGO_REGISTRY_TOKEN secret is needed. Configure
      # it at https://crates.io/crates/geoparquet-validator/settings under Trusted Publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
