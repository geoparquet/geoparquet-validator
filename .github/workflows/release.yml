name: Release

# Tag a version to publish it:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --features capi --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          NAME=geoparquet-validator-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p "$NAME/include"
          cp README.md LICENSE "$NAME"/
          cp include/geoparquet_validator.h "$NAME/include/"
          OUT=target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$OUT/geoparquet-validator.exe" "$OUT/geoparquet_validator.dll" "$NAME"/
            7z a "$NAME.zip" "$NAME"
          else
            cp "$OUT/geoparquet-validator" "$NAME"/
            cp "$OUT"/libgeoparquet_validator.so "$NAME"/ 2>/dev/null || cp "$OUT"/libgeoparquet_validator.dylib "$NAME"/
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true

  wheels:
    name: python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest,   target: aarch64 }
          - { os: macos-latest,   target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      # pyproject.toml selects the pyo3 bindings and the `python` feature; abi3 gives one wheel
      # per platform for every Python from 3.9 on. The wheel carries the module and the command.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.whl

  pypi:
    name: PyPI
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Trusted publishing: PyPI is configured to trust this repository and workflow (a "pending
      # publisher" can be registered before the first release).
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm:
    name: npm package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install wasm-bindgen (the version in Cargo.lock) and binaryen
        run: |
          sudo apt-get -qq install -y binaryen clang >/dev/null
          VER=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | sed -E 's/.*"([^"]+)".*/\1/')
          cargo install --locked wasm-bindgen-cli --version "$VER"
      - run: sh web/build-npm.sh
      - name: Smoke test in Node
        working-directory: npm
        run: node --input-type=module -e "import { check, conformant } from './index.js'; const r = await check('../corpus/data/bbox/bbox-present.parquet'); if (!conformant(r)) process.exit(1); console.log('ok', r.tool.version)"
        env:
          CI: true
      - name: Pack
        working-directory: npm
        run: npm pack
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: npm/*.tgz
      # The registry publish runs only once the package exists on npm and trusted publishing is
      # configured for this repository and workflow; flip the repository variable to enable it.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') && vars.NPM_TRUSTED_PUBLISHING == 'true'
        working-directory: npm
        run: npm publish --provenance --access public

  crate:
    name: crates.io
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: crates.io is configured to trust this repository and workflow, and
      # mints a short-lived token per run, so no CARGO_REGISTRY_TOKEN secret is needed. Configure
      # it at https://crates.io/crates/geoparquet-validator/settings under Trusted Publishing.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
