[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "geoparquet-validator"
description = "Validate GeoParquet files against the OGC abstract tests and the 1.0/1.1 community specifications"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://geoparquet.org/geoparquet-validator/"
Repository = "https://github.com/geoparquet/geoparquet-validator"

# The same wheel gives `import geoparquet_validator` and the `geoparquet-validator` command.
[project.scripts]
geoparquet-validator = "geoparquet_validator:main"

[tool.maturin]
bindings = "pyo3"
features = ["python"]
module-name = "geoparquet_validator._native"
python-source = "python"
strip = true
